minimum_prek_version = "0.4.12"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  # pnpm writes the lockfile as more than one YAML document.
  { id = "check-yaml", exclude = '^(docs/)?pnpm-lock\.yaml$' },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "biome check", entry = "pnpm run lint", language = "system", pass_filenames = false, files = '\.(ts|json)$' },
  { id = "typecheck", name = "tsc", entry = "pnpm run typecheck", language = "system", pass_filenames = false, files = '^((src|tests)/.*\.ts|[^/]*\.config\.ts|package\.json|pnpm-lock\.yaml|tsconfig\.json)$' },
  { id = "test", name = "vitest", entry = "pnpm test", language = "system", pass_filenames = false, files = '^((src|tests)/.*\.ts|[^/]*\.config\.ts|package\.json|pnpm-lock\.yaml|tsconfig\.json)$' },
]
