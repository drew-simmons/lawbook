version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The types track the lowest Node.js major in `engines`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
