version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # The types track the lowest Node.js major in `engines`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # Blume 2 needs a migration; see the "Migrate docs to Blume 2" issue.
      - dependency-name: blume
        update-types: ["version-update:semver-major"]
